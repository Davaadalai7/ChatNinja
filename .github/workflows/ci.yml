name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:relay
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked --manifest-path crates/chatninja-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/chatninja-core/Cargo.toml --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path crates/chatninja-core/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: npm run desktop:build
        env:
          CHATNINJA_GOOGLE_CLIENT_ID: ${{ vars.CHATNINJA_GOOGLE_CLIENT_ID }}
          CHATNINJA_GOOGLE_DESKTOP_SECRET: ${{ secrets.CHATNINJA_GOOGLE_DESKTOP_SECRET }}
          CHATNINJA_TWITCH_CLIENT_ID: ${{ vars.CHATNINJA_TWITCH_CLIENT_ID }}
          CHATNINJA_KICK_RELAY_ORIGIN: ${{ vars.CHATNINJA_KICK_RELAY_ORIGIN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ChatNinja-Windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
