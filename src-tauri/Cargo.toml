[package]
name = "jutsu"
version = "0.1.0"
description = "Jutsu streamer toolkit — desktop foundation"
edition = "2021"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
jutsu-config = { path = "../crates/jutsu-config" }
