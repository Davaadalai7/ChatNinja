[package]
name = "chatninja"
version = "0.1.0"
description = "Minimal multi-platform desktop chat overlay"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chatninja-core = { path = "../crates/chatninja-core" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
